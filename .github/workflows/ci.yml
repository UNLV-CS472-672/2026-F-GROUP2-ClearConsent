name: CI

on:
  push:
    branches: [main, fix/windows-setup]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ENABLE_PAID_ANALYSIS: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check formatting and lint
        run: npm run lint
      - name: Run Svelte checks
        run: npx svelte-kit sync && npm run check
        env:
          PUBLIC_SUPABASE_URL: 'https://eccdgjwsllkkdvsqtlzq.supabase.co'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_KXwbXRolrFfu8y2gsWgsfA_DykUtsV8'

      - name: Run unit tests with coverage thresholds
        run: npm run test:coverage
      - name: Test the schema readiness release gate offline
        run: npm run test:schema-readiness
      - name: Run synthetic offline evaluation regressions
        run: npm run test:offline
      - name: Run Stage 1 offline tests
        run: npm run test:stage1:offline
      - name: Run disposable database checks
        run: npm run test:db
      - name: Build production application
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: 'https://eccdgjwsllkkdvsqtlzq.supabase.co'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_KXwbXRolrFfu8y2gsWgsfA_DykUtsV8'
      - name: Run anonymous end-to-end tests
        run: npm run test:e2e -- --grep-invert @authenticated
        env:
          CI_E2E_EXPECTED: '4'
          PUBLIC_SUPABASE_URL: 'https://eccdgjwsllkkdvsqtlzq.supabase.co'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_KXwbXRolrFfu8y2gsWgsfA_DykUtsV8'
      # Only validated code on main can read the dedicated, non-admin test account.
      # Pull requests run the anonymous cases above without credentials.
      - name: Run authenticated end-to-end tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_E2E_EXPECTED: '5'
          PUBLIC_SUPABASE_URL: 'https://eccdgjwsllkkdvsqtlzq.supabase.co'
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_KXwbXRolrFfu8y2gsWgsfA_DykUtsV8'
          STUDY_TEST_EMAIL: ${{ secrets.STUDY_TEST_EMAIL }}
          STUDY_TEST_PASSWORD: ${{ secrets.STUDY_TEST_PASSWORD }}
        run: |
          if [ -z "$STUDY_TEST_EMAIL" ] || [ -z "$STUDY_TEST_PASSWORD" ]; then
            echo '::error::Dedicated test account secrets are missing.'
            exit 1
          fi
          npm run test:e2e -- --grep @authenticated
